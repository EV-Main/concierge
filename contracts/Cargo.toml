[package]
name = "evconcierge_contracts"
version = "0.1.0"
edition = "2024"
description = "gRPC wire contracts of the EV concierge identity plane: the .proto sources and the tonic client and server stubs generated from them."
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Main/concierge"
# The protos are the contract; the tests pin this repo's own wire history and stay home.
include = ["Cargo.toml", "build.rs", "src/**/*.rs", "proto/**/*.proto"]

[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true
