# Publishes `sdk/` (@evinvest/concierge) through npm trusted publishing (OIDC): no token,
# no 2FA, for a job matching the package's trusted-publisher entry (EV-Main/concierge,
# this file). Hand-written, not generated by the flake's github module: that module
# only overwrites the workflows it owns, and it warns about stray `*release*` files,
# hence the name. Retry a failed run by dispatching it with the same tag.
name: npm-publish
'on':
  push:
    tags: ['@evinvest/concierge-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, e.g. @evinvest/concierge-v0.1.1
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            @evinvest/concierge-v*) ;;
            *) echo "not a @evinvest/concierge release tag: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # OIDC publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Publish
        working-directory: sdk
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          npm ci
          npm run typecheck
          npm test
          npm publish --provenance --access public
