# Publishes `sdk/` (@evinvest/concierge) through npm trusted publishing (OIDC): no token,
# no 2FA, for a job matching the package's trusted-publisher entry (EV-Main/concierge,
# this file). Hand-written, not generated by the flake's github module: that module
# only overwrites the workflows it owns, and it warns about stray `*release*` files,
# hence the name. Retry a failed run by dispatching it with the same tag.
name: npm-publish
'on':
  push:
    tags: ['@evinvest/concierge-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, e.g. @evinvest/concierge-v0.1.1
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Strict, so a dispatched tag can only ever name a semver of this package.
          re='^@evinvest/concierge-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "not an @evinvest/concierge-v<semver> tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          # Full history for the ancestry check below; no token left in .git/config
          # for `npm ci` install scripts to read.
          fetch-depth: 0
          persist-credentials: false
      # A tag pushed onto an unmerged branch commit must not reach npm. HEAD, not
      # GITHUB_SHA: on workflow_dispatch GITHUB_SHA is the dispatching branch, not the tag.
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$(git rev-parse HEAD) is not on main" >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # OIDC publishing needs npm >= 11.5.1, and the npm bundled with the runner's cached
      # Node 24 may be older. Pinned: this job can mint an id-token, so it never installs
      # whatever `latest` happens to be.
      - run: npm install -g npm@11.21.0
      - name: Publish
        working-directory: sdk
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          npm ci
          npm run typecheck
          npm test
          # npm 11 refuses a prerelease without an explicit dist-tag, and `latest` must
          # never point at one.
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag"
